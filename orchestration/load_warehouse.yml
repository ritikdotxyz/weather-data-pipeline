id: load_warehouse
namespace: weather_data_pipeline

description: This  flow will execute a python script that will add all the raw
  parquet data to duckdb

tasks:
  - id: load_warehouse
    type: io.kestra.plugin.scripts.python.Commands
    namespaceFiles:
      enabled: True
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      volumes:
        - /home/ritik/workspace/projects/weather_data_pipeline:/app
    containerImage: python:3.12-slim
    dependencies:
      - duckdb>=1.5.6
      - loguru>=0.7.3
    commands:
      - cd /app
      - python ingestion/load_data_to_warehouse.py
    retry:
      type: constant
      interval: PT2S
      maxAttempts: 3
      maxDuration: PT1M
      warningOnRetry: false